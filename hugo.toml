baseURL = "https://go-widgets.github.io/"
title = "go-widgets"
disableKinds = ["taxonomy", "term", "RSS", "sitemap", "404"]

[markup.goldmark.renderer]
  unsafe = true

[[params.components]]
  name = "toolkit"
  status = "ready"
  blurb = "**[toolkit](https://github.com/go-widgets/toolkit)** (v0.109.0) — pure-Go pixel-blitting widget set, **100+ widgets** (114 in the live snapshot gallery): the GTK-4 / DaisyUI staples (Button, Entry, TreeView, Menu, Notebook, Dialog, …), a full chart family (Line / Bar / Pie / Area / Scatter / Radar / Sparkline, with value-on-hover crosshairs), and interactive extras — Accordion, Carousel, CommandPalette, Wizard, DateRangePicker, ColorPicker, SegmentedBar, MarkdownEditor. A **dashboard / data suite** anchors it: a `Table` with cell editing, frozen columns, group rows, aggregate summaries and row-expanders; `TreeTable`, `PropertyGrid`, `Kanban` (drag cards) and `Gantt` (drag / resize bars); and an **event-calendar `Agenda`** (week / month / quarter / year) with **multiple colour-coded calendars**, a **sidebar** to toggle each on and off, and an **inline event editor**. A **`Skeleton` loading-screen family** covers first paint — shimmering text / rectangle / circle placeholders driven by `SetPhase`, composed into `NewSkeletonCard` and full-page `NewPageSkeleton` shells. Lists and tables gained multi-select, virtualized rendering, and drag-to-reorder; editors gained undo/redo, IME composition, and touch/gesture input; there's PNG export, a global clipboard, and built-in form validation. A complete container + layout-manager system rounds it out (`Container` + swappable `Layout` — `FitLayout`/`BoxLayout`/`BorderLayout`/`CardLayout`/`FlowLayout` — behind the `HBox`/`VBox`/`Grid`, `Dock`, `Border` (with splitters) convenience wrappers, a declarative `Node` builder and a `ViewController`). The opt-in accessibility bridge exposes role / name / value metadata, and every widget composes through a pluggable scalable `Font`. 100% statement coverage. `LoadGTKTheme(css)` parses libadwaita/GTK3 `@define-color` → `Theme`. Every widget is systematically parameterizable for **placement & orientation** — Notebook `TabSide` (top/bottom/left/right), vertical `ProgressBar`/`LevelBar`/`Scale`/`RangeSlider`, `Label`/`Table`-column `Align`, `DropDown.OpenUp`, `Toolbar`/`Steps` `Orientation`, horizontal `Timeline`, and corner-anchored, stackable `Toast`/`Notification` — the same widget code renders top/bottom/left/right, horizontal/vertical."
[[params.components]]
  name = "pure-Go font stack"
  status = "ready"
  blurb = "Text now renders through **[go-opentype](https://github.com/go-opentype/opentype)**, a zero-dependency TrueType/OpenType engine — the toolkit dropped its `x/image` font dependency entirely. Bundled, legible faces ship via **[go-opentype/fonts](https://github.com/go-opentype/fonts)**, with Atkinson Hyperlegible as the default `Font`. Same byte-buffer-first axiom: glyphs rasterize straight into the caller's pixel buffer, no C font library, no system font lookup required."
[[params.components]]
  name = "Byte-buffer first"
  status = "ready"
  blurb = "Every widget composes pixels into a caller-supplied `[]byte`. No JS, no DOM, no canvas dep at the toolkit level. Works identically in `GOOS=js GOARCH=wasm` (browser SharedArrayBuffer clients), on any native Go target (native canvas backends, PNG output), or in headless tests (screenshot-hash regressions)."
[[params.components]]
  name = "GTK-theme aware"
  status = "ready"
  blurb = "`LoadGTKTheme(css)` reads any GTK3 / libadwaita `@define-color` block (Adwaita, Juno, WhiteSur, Solarized …) and hands you a `Theme` value that cascades through every widget. One assignment, whole app repaints."
[[params.components]]
  name = "svg — RGBA → SVG snapshot"
  status = "ready"
  blurb = "**[svg](https://github.com/go-widgets/svg)** — wraps any RGBA render (a toolkit widget composition or any other pixel producer) in a self-contained SVG with the pixels embedded as a base-64 PNG. Bit-exact, scales crisply. Sibling `svg/widget` takes a `toolkit.Widget` directly; `svg/cmd/gallery-render` batch-renders every widget kind (**114 snapshots**, light + dark). See the [live snapshot gallery](https://go-widgets.github.io/svg/). 100 % statement coverage."
[[params.components]]
  name = "gallery — live wasm demo"
  status = "ready"
  blurb = "**[gallery](https://github.com/go-widgets/gallery)** — a browser wasm live-demo running the toolkit's full widget family set on a plain canvas. See it at [go-widgets.github.io/gallery](https://go-widgets.github.io/gallery/). No SharedArrayBuffer, no COOP/COEP; drops into any static host."
[[params.components]]
  name = "tui — terminal cell widgets"
  status = "ready"
  blurb = "**[tui](https://github.com/go-widgets/tui)** — pure-Go cell-native widget set that renders into a terminal cell grid via a `CellPainter` (the same `painter.Painter` seam the pixel backend uses). 34 widgets + a FocusRing, plus a Sparkline mini-chart, syntax-highlighted TextEditor, and dogfooding demos (tui-explorer / tui-editor / tui-widget-explorer). Same byte-buffer-first axiom, terminal backing store. 100% statement coverage."
